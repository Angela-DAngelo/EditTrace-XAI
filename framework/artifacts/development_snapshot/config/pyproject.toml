[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edittrace-xai"
version = "0.3.0"
description = "Deterministic executable edit histories for action-level XAI research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "torchvision>=0.19"]
evaluation = ["lpips>=0.1.4,<1", "scikit-image>=0.24,<1"]

[project.scripts]
edittrace = "edittrace_xai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
